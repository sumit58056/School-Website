<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Dashboard | VMI</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .db-table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 0.9rem; }
        .db-table th, .db-table td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        .db-table th { background-color: #003366; color: white; position: sticky; top: 0; }
        .db-table tr:nth-child(even) { background-color: #f4f7f6; }
        .section-divider { margin-top: 30px; margin-bottom: 20px; border-bottom: 2px solid #eee; padding-bottom: 5px; color: #003366; }
        .marks-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
    </style>
</head>
<body class="admin-bg">
    <header class="admin-header">
        <div class="logo"><img src="logo.jpg" alt="VMI Logo"><h2>VMI Faculty Portal</h2></div>
        <div class="admin-profile"><span>Welcome, Faculty Member</span><a href="index.html" class="logout-btn">Log Out</a></div>
    </header>

    <div class="admin-layout">
        <aside class="admin-sidebar">
            <ul class="admin-nav">
                <li><a href="#" class="nav-link active" data-target="section-materials">📚 Study Materials</a></li>
                <li><a href="#" class="nav-link" data-target="section-results">📊 Manage Exam Results</a></li>
            </ul>
        </aside>

        <main class="admin-content">
            <!-- Study Materials -->
            <div id="section-materials" class="admin-section active">
                <div class="dashboard-card">
                    <h3>Publish Study Materials & Syllabus</h3>
                    <form class="admin-form" id="material-form">
                        <div class="input-group"><label>Document Title</label><input type="text" id="mat-title" required></div>
                        <div style="display: flex; gap: 15px;">
                            <div class="input-group" style="flex: 1;"><label>Target Class</label><select id="mat-class" required><option value="All">All Classes</option><option>LKG</option><option>U.K.G</option><option>Class 1</option><option>Class 2</option><option>Class 3</option><option>Class 4</option><option>Class 5</option><option>Class 6</option><option>Class 7</option><option>Class 8</option></select></div>
                            <div class="input-group" style="flex: 1;"><label>Category</label><select id="mat-category" required><option>Study Material</option><option>Syllabus</option></select></div>
                        </div>
                        <div class="input-group"><label>Drive Link</label><input type="url" id="mat-link" required></div>
                        <button type="submit" class="admin-submit-btn" id="mat-submit-btn">Publish Document</button>
                    </form>
                </div>
            </div>

            <!-- Exam Results -->
            <div id="section-results" class="admin-section">
                <div class="dashboard-card">
                    <h3>Upload Examination Results (Report Card)</h3>
                    
                    <form class="admin-form" id="manual-result-form">
                        <div style="display: flex; gap: 15px;">
                            <div class="input-group" style="flex: 1;"><label>Student ID</label><input type="text" id="res-student-id" required></div>
                            <div class="input-group" style="flex: 1;">
                                <label>Student Class</label>
                                <select id="res-class" required>
                                    <option value="" disabled selected>-- Select Class --</option>
                                    <option>LKG</option><option>U.K.G</option><option>Class 1</option><option>Class 2</option><option>Class 3</option>
                                    <option>Class 4</option><option>Class 5</option><option>Class 6</option><option>Class 7</option><option>Class 8</option>
                                </select>
                            </div>
                            <div class="input-group" style="flex: 1;">
                                <label>Exam Term</label>
                                <select id="res-exam-name" required>
                                    <option value="" disabled selected>-- Select Term --</option>
                                    <option>1st Summative</option><option>2nd Summative</option><option>Annual Examination</option>
                                </select>
                            </div>
                        </div>

                        <h5 style="margin-top: 10px; color: #FF671F;">Academic Subjects (Dynamic Max Marks based on Scheme)</h5>
                        <div class="marks-grid">
                            <div class="input-group"><label>English</label><input type="number" class="acad-mark" id="m-eng" placeholder="Marks" required></div>
                            <div class="input-group"><label>Bengali</label><input type="number" class="acad-mark" id="m-ben" placeholder="Marks" required></div>
                            <div class="input-group"><label>Hindi</label><input type="number" class="acad-mark" id="m-hin" placeholder="Marks" required></div>
                            <div class="input-group"><label>Sanskrit</label><input type="number" class="acad-mark" id="m-san" placeholder="Marks" required></div>
                            <div class="input-group"><label>Mathematics</label><input type="number" class="acad-mark" id="m-mat" placeholder="Marks" required></div>
                            <div class="input-group"><label>EVS / Science</label><input type="number" class="acad-mark" id="m-evs" placeholder="Marks" required></div>
                            <div class="input-group"><label>History</label><input type="number" class="acad-mark" id="m-his" placeholder="Marks" required></div>
                            <div class="input-group"><label>Geography</label><input type="number" class="acad-mark" id="m-geo" placeholder="Marks" required></div>
                        </div>

                        <h5 style="margin-top: 10px; color: #FF671F;">Co-Curricular Grades</h5>
                        <div class="marks-grid">
                            <div class="input-group"><label>Dance</label><select id="g-dance"><option value="">-- Grade --</option><option>A+</option><option>A</option><option>B+</option><option>B</option><option>C</option><option>D/P</option><option>F</option></select></div>
                            <div class="input-group"><label>Music</label><select id="g-music"><option value="">-- Grade --</option><option>A+</option><option>A</option><option>B+</option><option>B</option><option>C</option><option>D/P</option><option>F</option></select></div>
                            <div class="input-group" id="art-container" style="display: none;"><label>Art & Craft (Annual Only)</label><select id="g-art"><option value="">-- Grade --</option><option>A+</option><option>A</option><option>B+</option><option>B</option><option>C</option><option>D/P</option><option>F</option></select></div>
                        </div>

                        <button type="submit" class="admin-submit-btn" id="res-submit-btn">Save Report Card</button>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <script>
        const navLinks = document.querySelectorAll('.nav-link');
        const sections = document.querySelectorAll('.admin-section');
        navLinks.forEach(link => {
            link.addEventListener('click', function(e) {
                e.preventDefault();
                navLinks.forEach(nav => nav.classList.remove('active'));
                sections.forEach(section => section.classList.remove('active'));
                this.classList.add('active');
                document.getElementById(this.getAttribute('data-target')).classList.add('active');
            });
        });
    </script>

    <!-- Firebase Integration -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAfjCmscYLNyG2sIqfQqQ2FWG9_vWp-N0o",
            authDomain: "vmi-portal.firebaseapp.com",
            projectId: "vmi-portal",
            storageBucket: "vmi-portal.firebasestorage.app",
            messagingSenderId: "215224119153",
            appId: "1:215224119153:web:7e1b272444c3c9d696d0d0"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Materials
        document.getElementById('material-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            await setDoc(doc(db, "materials", `doc_${Date.now()}`), {
                title: document.getElementById('mat-title').value, class: document.getElementById('mat-class').value, category: document.getElementById('mat-category').value, link: document.getElementById('mat-link').value, publishedBy: "Faculty", date: new Date().toLocaleDateString(), timestamp: Date.now()
            });
            alert(`Document Published!`); document.getElementById('material-form').reset();
        });

        // --- DYNAMIC MARKS LOGIC ---
        const termSelect = document.getElementById('res-exam-name');
        const classSelect = document.getElementById('res-class');
        const artContainer = document.getElementById('art-container');
        const markInputs = document.querySelectorAll('.acad-mark');
        let currentMaxPerSubject = 100;

        function updateFormRules() {
            const term = termSelect.value;
            const stuClass = classSelect.value;
            
            // 1. Handle Art & Craft Visibility
            if(term === 'Annual Examination') { artContainer.style.display = 'block'; } 
            else { artContainer.style.display = 'none'; document.getElementById('g-art').value = ""; }

            // 2. Handle Max Marks Calculation
            if(term && stuClass) {
                const isJunior = ['LKG', 'U.K.G', 'Class 1', 'Class 2', 'Class 3', 'Class 4', 'Class 5'].includes(stuClass);
                const isSenior = ['Class 6', 'Class 7', 'Class 8'].includes(stuClass);

                if (term === '1st Summative') currentMaxPerSubject = isJunior ? 20 : 30;
                else if (term === '2nd Summative') currentMaxPerSubject = isJunior ? 30 : 40;
                else if (term === 'Annual Examination') currentMaxPerSubject = isJunior ? 50 : 80;

                markInputs.forEach(input => {
                    input.max = currentMaxPerSubject;
                    input.placeholder = `Max: ${currentMaxPerSubject}`;
                });
            }
        }
        termSelect.addEventListener('change', updateFormRules);
        classSelect.addEventListener('change', updateFormRules);

        // Upload Results
        document.getElementById('manual-result-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const studentId = document.getElementById('res-student-id').value;
            const term = termSelect.value;
            
            const marks = {
                "English": Number(document.getElementById('m-eng').value),
                "Bengali": Number(document.getElementById('m-ben').value),
                "Hindi": Number(document.getElementById('m-hin').value),
                "Sanskrit": Number(document.getElementById('m-san').value),
                "Mathematics": Number(document.getElementById('m-mat').value),
                "EVS_Science": Number(document.getElementById('m-evs').value),
                "History": Number(document.getElementById('m-his').value),
                "Geography": Number(document.getElementById('m-geo').value)
            };

            const totalObtained = Object.values(marks).reduce((sum, mark) => sum + mark, 0);
            const totalPossible = currentMaxPerSubject * 8;
            const percentage = ((totalObtained / totalPossible) * 100).toFixed(2) + "%";

            const grades = {
                "Dance": document.getElementById('g-dance').value,
                "Music": document.getElementById('g-music').value
            };
            if(term === 'Annual Examination') grades["Art_and_Craft"] = document.getElementById('g-art').value;

            await setDoc(doc(db, "results", `${studentId}_${term}`.replace(/\s+/g, '_')), {
                "Student ID": studentId, "Class": classSelect.value, "Exam Term": term,
                "Academic Marks": marks, "Total Marks": totalObtained, "Max Marks": totalPossible, "Percentage": percentage,
                "CoCurricular Grades": grades, "Uploaded By": "Faculty", "Publish Date": new Date().toLocaleDateString()
            }, { merge: true });

            alert(`Success! Report Card saved.`); document.getElementById('manual-result-form').reset();
            artContainer.style.display = 'none';
        });
    </script>
</body>
</html>
