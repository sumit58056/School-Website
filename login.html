<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Login | VMI Network</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .login-card { background: white; padding: 40px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; border-top: 5px solid #FF671F; }
        .logo-container { margin-bottom: 20px; }
        .logo-container img { width: 80px; height: 80px; object-fit: contain; background: #003366; border-radius: 50%; padding: 5px; }
        .login-card h2 { color: #003366; margin: 10px 0 5px 0; }
        .login-card p { color: #666; font-size: 0.9rem; margin-bottom: 25px; }
        .input-group { text-align: left; margin-bottom: 20px; }
        .input-group label { display: block; font-size: 0.85rem; font-weight: bold; color: #333; margin-bottom: 5px; }
        .input-group input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 1rem; }
        .btn-login { width: 100%; padding: 12px; background-color: #003366; color: white; border: none; border-radius: 4px; font-weight: bold; font-size: 1rem; cursor: pointer; transition: 0.3s; }
        .btn-login:hover:not(:disabled) { background-color: #002244; }
        .btn-login:disabled { opacity: 0.7; cursor: not-allowed; }
        .error-msg { color: #E63946; font-size: 0.85rem; margin-bottom: 15px; display: none; font-weight: bold; }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="logo-container">
            <img src="logo.jpg" alt="VMI Logo" onerror="this.src='https://via.placeholder.com/80/003366/FFFFFF?text=VMI'">
        </div>
        <h2>Staff Portal Login</h2>
        <p>Vivekananda Mission Institute Network</p>

        <div id="error-message" class="error-msg">Invalid ID or Password.</div>

        <form id="login-form">
            <div class="input-group">
                <label>Staff ID</label>
                <input type="text" id="login-id" placeholder="e.g., VMI/SADM/001" required>
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="login-password" placeholder="Enter your password" required>
            </div>
            <button type="submit" class="btn-login" id="login-btn">Secure Login</button>
        </form>
    </div>

    <!-- Firebase Integration -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = { 
            apiKey: "AIzaSyAfjCmscYLNyG2sIqfQqQ2FWG9_vWp-N0o", 
            authDomain: "vmi-portal.firebaseapp.com", 
            projectId: "vmi-portal", 
            storageBucket: "vmi-portal.firebasestorage.app", 
            messagingSenderId: "215224119153", 
            appId: "1:215224119153:web:7e1b272444c3c9d696d0d0" 
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('login-btn');
            const errorMsg = document.getElementById('error-message');
            const staffId = document.getElementById('login-id').value.trim();
            const password = document.getElementById('login-password').value.trim();

            btn.disabled = true;
            btn.innerText = "Authenticating...";
            errorMsg.style.display = 'none';

            try {
                let userRecord = null;
                let userCampus = null;

                // 1. Search Main Campus DB
                const mainQuery = query(collection(db, "teachers"), where("TeacherID", "==", staffId), where("Password", "==", password));
                const mainSnaps = await getDocs(mainQuery);
                if (!mainSnaps.empty) {
                    userRecord = mainSnaps.docs[0].data();
                    userCampus = "main";
                } else {
                    // 2. Search Branch Campus DB if not found in Main
                    const branchQuery = query(collection(db, "cvsk_staff"), where("TeacherID", "==", staffId), where("Password", "==", password));
                    const branchSnaps = await getDocs(branchQuery);
                    if (!branchSnaps.empty) {
                        userRecord = branchSnaps.docs[0].data();
                        userCampus = "branch";
                    }
                }

                if (userRecord) {
                    const sessionData = {
                        id: userRecord.TeacherID,
                        name: userRecord.Name,
                        role: userRecord.Department,
                        campus: userCampus
                    };
                    
                    // Securely store session
                    localStorage.setItem('vmi_user', JSON.stringify(sessionData));

                    // Role Enforcement Routing
                    if (sessionData.role === 'Super Admin') {
                        window.location.href = 'admin-dashboard.html';
                    } else if (sessionData.role === 'Admin') {
                        window.location.href = 'cvsk-admin.html';
                    } else {
                        alert(`Welcome ${sessionData.name}! The standard Teacher portal is currently under construction.`);
                        btn.disabled = false;
                        btn.innerText = "Secure Login";
                    }
                } else {
                    errorMsg.style.display = 'block';
                    btn.disabled = false;
                    btn.innerText = "Secure Login";
                }
            } catch (error) {
                console.error(error);
                errorMsg.innerText = "Network Error. Please try again.";
                errorMsg.style.display = 'block';
                btn.disabled = false;
                btn.innerText = "Secure Login";
            }
        });
    </script>
</body>
</html>
