<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Login | VMI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-bg">
    
    <div class="login-container">
        <div class="login-header">
            <img src="logo.jpg" alt="VMI Logo">
            <h2>VMI Portal Login</h2>
            <p>Enter your credentials to access your dashboard</p>
        </div>

        <!-- NOTE: Removed action and method attributes here -->
        <form class="login-form">
            <div class="input-group">
                <label for="role">Login As</label>
                <select id="role" name="role" required>
                    <option value="student">Student / Parent</option>
                    <option value="faculty">Faculty</option>
                    <option value="admin">Administrator</option>
                </select>
            </div>

            <div class="input-group">
                <label for="userid">User ID / Email</label>
                <!-- Changed to type="email" for Firebase Auth -->
                <input type="email" id="userid" name="userid" placeholder="Enter your Admin Email" required>
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
            </div>

            <div class="form-actions">
                <div class="remember-me">
                    <input type="checkbox" id="remember">
                    <label for="remember">Remember me</label>
                </div>
                <a href="#" class="forgot-password">Forgot Password?</a>
            </div>

            <button type="submit" class="login-submit-btn">Secure Login</button>
        </form>

        <div class="login-footer">
            <p><a href="index.html">← Return to Homepage</a></p>
        </div>
    </div>

    <!-- Firebase SDK Integration -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // Your specific Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyAfjCmscYLNyG2sIqfQqQ2FWG9_vWp-N0o",
            authDomain: "vmi-portal.firebaseapp.com",
            projectId: "vmi-portal",
            storageBucket: "vmi-portal.firebasestorage.app",
            messagingSenderId: "215224119153",
            appId: "1:215224119153:web:7e1b272444c3c9d696d0d0"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // Handle the Login Form Submission
        const loginForm = document.querySelector('.login-form');
        const submitBtn = document.querySelector('.login-submit-btn');

        loginForm.addEventListener('submit', (e) => {
            e.preventDefault(); // This is the magic line that stops the 405 error!
            
            const originalBtnText = submitBtn.innerText;
            submitBtn.innerText = "Authenticating...";
            submitBtn.style.backgroundColor = "#555";

            const role = document.getElementById('role').value;
            const email = document.getElementById('userid').value; 
            const password = document.getElementById('password').value;

            // Enforce Admin role
            if (role !== 'admin') {
                alert("Currently, only Administrator logins are active.");
                submitBtn.innerText = originalBtnText;
                submitBtn.style.backgroundColor = "#003366";
                return;
            }

            // Attempt Firebase Login
            signInWithEmailAndPassword(auth, email, password)
                .then((userCredential) => {
                    alert("Login Successful! Redirecting to dashboard...");
                    window.location.href = "admin-dashboard.html";
                })
                .catch((error) => {
                    alert("Login Failed: " + error.message);
                    submitBtn.innerText = originalBtnText;
                    submitBtn.style.backgroundColor = "#003366";
                });
        });
    </script>
</body>
</html>
